<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img" aria-labelledby="title description">
  <title id="title">CPTAC tumor-only covariance-null distribution</title>
  <desc id="description">Histogram of 499 real covariance-preserving null draws. Observed maximum H1 persistence is 5.354; 45 null draws meet or exceed it. The one-sided plus-one Monte Carlo p-value is 0.092. This does not meet a threshold of 0.05.</desc>
