name: Publish verified v0.3.0 matched-study release

# One-off bridge from a successful main-branch CI push to the owner's
# enabled GitHub-to-Zenodo integration. No manual Zenodo upload is made.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-verified-v0.3.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v0.3.0
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout precisely the successful main CI source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify canonical branch, archive boundaries and registered source files
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          test "$actual" = "$EXPECTED_SHA"
          test "$actual" = "$latest"
          test "$(gh release view v0.1.0-biorxiv --json tagName --jq .tagName)" = "v0.1.0-biorxiv"
          test "$(gh release view v0.2.0 --json tagName --jq .tagName)" = "v0.2.0"
          sha256sum -c checksums.sha256
          python audit/verify_archive_provenance.py
          python audit/cptac_matched_null/verify_evidence.py
          test -s release/v0.3.0/RELEASE_NOTES.md
          grep -Eq '^version: 0[.]3[.]0$' CITATION.cff
          grep -Eq '^date-released: 2026-10-10$' CITATION.cff
          if grep -Eq '^doi:.*10[.]5281/zenodo[.](21287944|23272317|21287943)' CITATION.cff; then
            echo "::error::A previous version/concept DOI was misassigned to v0.3.0"
            exit 1
          fi
          echo "Source validated: $actual"

      - name: Validate citation file schema for Zenodo ingestion
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install cffconvert==2.0.0
          cffconvert --validate -i CITATION.cff

      - name: Refuse republishing or taking over an existing v0.3.0 tag
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::v0.3.0 already published; do not overwrite or republish"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "::error::v0.3.0 tag already exists; do not move or reuse it"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub v0.3.0 Release and trigger Zenodo integration
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --target "$EXPECTED_SHA" \
            --title "v0.3.0 — Completed matched CPTAC tumor-null study" \
            --notes-file release/v0.3.0/RELEASE_NOTES.md \
            --latest

      - name: Prove GitHub Release publication and immutable tag target
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,url,publishedAt \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, url: .url, published: .publishedAt}'
          target="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          if [ "$target" != "$EXPECTED_SHA" ]; then
            echo "::error::GitHub Release v0.3.0 does not target validated commit"
            exit 1
          fi
          echo "Verified published release: $RELEASE_TAG / $target"
          echo "Zenodo publication and the new DOI are independent post-release checks."
