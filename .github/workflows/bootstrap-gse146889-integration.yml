name: Bootstrap GSE146889 clean-lineage integration

on:
  push:
    branches:
      - audit/gse146889-clean-lineage
    paths:
      - ".github/workflows/bootstrap-gse146889-integration.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-gse146889-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/gse146889-clean-lineage
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve public documentation and verification boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          anchor = (
              "      real-data statistics were verified to match the committed report closely -- see\n"
              "      `code/confound_attribution_audit/README.md` for the full disclosure.\n"
          )
          addition = anchor + (
              "      **Clean-lineage resolution (2026-08-21):** this lineage weakness is now independently\n"
              "      audited under `audit/gse146889_clean_lineage/`. A protocol was committed before\n"
              "      execution; the official GEO matrix was re-fetched and hashed; preprocessing, PCA, PH,\n"
              "      Gaussian/permutation nulls, residualization, cocycle-support diagnostics, and bootstrap\n"
              "      draws were regenerated without importing the reconstructed driver or its saved nulls.\n"
              "      Under matched historical definitions, every deterministic real-data quantity reproduced\n"
              "      exactly and the qualified GSE146889 verdict was sustained. The reconstructed driver is\n"
              "      retained only as historical provenance, not as the authoritative verification path.\n"
          )
          if "Clean-lineage resolution (2026-08-21)" not in text:
              if anchor not in text:
                  raise SystemExit("README resolution anchor not found")
              text = text.replace(anchor, addition, 1)
              readme.write_text(text, encoding="utf-8")

          audit_readme = Path("code/confound_attribution_audit/README.md")
          text = audit_readme.read_text(encoding="utf-8")
          anchor = (
              "  (near-exact); residualized z_gaussian in the right range at reduced draw counts.**\n"
          )
          addition = anchor + (
              "  **Clean-lineage resolution (2026-08-21):** `audit/gse146889_clean_lineage/` now provides\n"
              "  an independent from-raw-data rerun frozen before execution. It does not import this\n"
              "  reconstructed driver or reuse its null pickles. The full declared Monte Carlo/bootstrap\n"
              "  program completed successfully; matched deterministic quantities reproduced exactly and\n"
              "  regenerated stochastic results preserved the same bounded interpretation.\n"
          )
          if "Clean-lineage resolution (2026-08-21)" not in text:
              if anchor not in text:
                  raise SystemExit("confound README resolution anchor not found")
              text = text.replace(anchor, addition, 1)
              audit_readme.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          anchor = "      - name: Run reproduce.py smoke test\n        run: python reproduce.py\n"
          addition = anchor + (
              "\n      - name: Verify GSE146889 clean-lineage audit record\n"
              "        run: |\n"
              "          python -m py_compile audit/gse146889_clean_lineage/prepare.py audit/gse146889_clean_lineage/worker.py audit/gse146889_clean_lineage/aggregate.py audit/gse146889_clean_lineage/reconcile_results.py\n"
              "          (cd audit/gse146889_clean_lineage/results && sha256sum -c SHA256SUMS)\n"
          )
          if "Verify GSE146889 clean-lineage audit record" not in text:
              if anchor not in text:
                  raise SystemExit("CI insertion anchor not found")
              text = text.replace(anchor, addition, 1)
              ci.write_text(text, encoding="utf-8")
          PY

      - name: Archive executed workflow and retire write-capable copies
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/gse146889-clean-lineage.yml audit/gse146889_clean_lineage/EXECUTION_WORKFLOW.yml
          rm .github/workflows/gse146889-clean-lineage.yml
          rm .github/workflows/bootstrap-gse146889-integration.yml

      - name: Regenerate repository completeness registries
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          files = sorted(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          if "MANIFEST.md" not in files or "checksums.sha256" not in files:
              raise SystemExit("integrity registry paths missing from index")

          checksum_paths = [p for p in files if p != "checksums.sha256"]
          checksum_size = sum(64 + 2 + len(p.encode("utf-8")) + 1 for p in checksum_paths)

          manifest_size = 0
          for _ in range(30):
              rows = ["# MANIFEST", "", "| File | Size (bytes) |", "|---|---|"]
              for rel in files:
                  if rel == "MANIFEST.md":
                      size = manifest_size
                  elif rel == "checksums.sha256":
                      size = checksum_size
                  else:
                      size = (root / rel).stat().st_size
                  rows.append(f"| {rel} | {size} |")
              content = "\n".join(rows) + "\n"
              new_size = len(content.encode("utf-8"))
              if new_size == manifest_size:
                  break
              manifest_size = new_size
          else:
              raise SystemExit("MANIFEST size did not converge")
          (root / "MANIFEST.md").write_text(content, encoding="utf-8")

          lines = []
          for rel in checksum_paths:
              h = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              lines.append(f"{h}  {rel}")
          (root / "checksums.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          sha256sum -c checksums.sha256
          git add -A

      - name: Commit bounded integration state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git diff --cached --stat
          git commit -m "audit: finalize GSE146889 clean-lineage integration"
          git push origin HEAD:audit/gse146889-clean-lineage
