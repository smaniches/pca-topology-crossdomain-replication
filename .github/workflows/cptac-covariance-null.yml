name: CPTAC tumor covariance-preserving null

on:
  pull_request:
    paths:
      - 'audit/cptac_covariance_null/**'
      - '.github/workflows/cptac-covariance-null.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run bounded pilot or 499-draw prospective sensitivity'
        required: true
        default: pilot
        type: choice
        options: [pilot, confirm]

permissions:
  contents: read

concurrency:
  group: tumor-cov-null-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned environment
        run: python -m pip install -r requirements.txt
      - name: Verify registered data and original evidence hashes
        run: sha256sum -c checksums.sha256
      - name: Test Helmert/Haar covariance and PCA invariants
        run: python -m unittest discover -s audit/cptac_covariance_null -p 'test_*.py' -v

  pilot:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot')
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned environment
        run: python -m pip install -r requirements.txt
      - name: Execute 24-draw pilot with frozen seed
        run: python audit/cptac_covariance_null/experiment.py --mode pilot --draws 24 --out artifacts/cptac_tumor_cov_null_pilot.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: cptac-tumor-cov-null-pilot-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 7

  confirm:
    # A 499-draw repetition cannot be launched automatically by a PR.
    # Review pilot validity and runtimes before explicitly selecting confirm.
    # One-time branch-restricted execution, after the 24-draw pilot passed in 37959161852.
    # Restore manual-only condition before merge.
    if: (github.event_name == 'pull_request' && github.head_ref == 'research/methodological-correction-20261009') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'confirm')
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned environment
        run: python -m pip install -r requirements.txt
      - name: Execute 499-draw sensitivity with independent seed
        run: python audit/cptac_covariance_null/experiment.py --mode confirm --out artifacts/cptac_tumor_cov_null_confirm.json
      - name: Preserve exact numeric evidence in this one-off replay log
        if: github.event_name == 'pull_request' && github.head_ref == 'research/methodological-correction-20261009'
        run: |
          echo 'RESULT_B64_BEGIN'
          base64 -w0 artifacts/cptac_tumor_cov_null_confirm.json
          echo
          echo 'RESULT_B64_END'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: cptac-tumor-cov-null-confirm-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
