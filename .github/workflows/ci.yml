name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify checksums
        run: sha256sum -c checksums.sha256

      - name: Verify historical release citation and sealed submission evidence
        run: python audit/verify_archive_provenance.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate data-derived CPTAC null histogram
        run: python audit/cptac_covariance_null/plot_null_distribution.py --check

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run reproduce.py smoke test
        run: python reproduce.py

      - name: Verify GSE146889 clean-lineage audit record
        run: |
          python -m py_compile audit/gse146889_clean_lineage/prepare.py audit/gse146889_clean_lineage/worker.py audit/gse146889_clean_lineage/aggregate.py audit/gse146889_clean_lineage/verify_reconciliation.py
          python audit/gse146889_clean_lineage/test_integrity_guards.py
          (cd audit/gse146889_clean_lineage/results && sha256sum -c SHA256SUMS)
          python audit/gse146889_clean_lineage/verify_reconciliation.py --repo-root .

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit pinned dependencies
        run: python -m pip_audit -r requirements.txt --strict

  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate Zenodo-ingested citation file against CFF 1.2
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate -i CITATION.cff

  docs-quickstart:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify README quickstart in a new clone and virtual environment
        shell: bash
        run: |
          git clone "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pca-docs-clean-clone"
          cd "$RUNNER_TEMP/pca-docs-clean-clone"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3.11 -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
          sha256sum -c checksums.sha256
          python reproduce.py
          test -s reproduce_output/persistence_diagrams_real_vs_gaussian.png
          test -s reproduce_output/barcode_and_null_distributions.png
