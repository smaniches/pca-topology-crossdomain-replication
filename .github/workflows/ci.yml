name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify checksums
        run: sha256sum -c checksums.sha256

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run reproduce.py smoke test
        run: python reproduce.py

      - name: Verify GSE146889 clean-lineage audit record
        run: |
          python -m py_compile audit/gse146889_clean_lineage/prepare.py audit/gse146889_clean_lineage/worker.py audit/gse146889_clean_lineage/aggregate.py audit/gse146889_clean_lineage/verify_reconciliation.py
          (cd audit/gse146889_clean_lineage/results && sha256sum -c SHA256SUMS)
          python audit/gse146889_clean_lineage/verify_reconciliation.py --repo-root .

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit pinned dependencies
        run: python -m pip_audit -r requirements.txt --strict
